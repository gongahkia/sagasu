name: Publish availability website

on:
  schedule:
    # Rebuild from locally published sanitized data; no SMU access here.
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main, master, availability-data]
    paths:
      - 'snapshot.json'
      - 'status.json'
      - 'web/**'
      - 'scripts/**'
      - 'asset/logo/**'
      - '.github/workflows/availability.yml'

permissions:
  contents: read

concurrency:
  group: sagasu-public-availability
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/availability-data'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Load retained public snapshot
        env:
          DATA_DIR: ${{ runner.temp }}/sagasu-public-data
        run: |
          if git ls-remote --exit-code --heads origin availability-data > /dev/null; then
            git fetch --depth=1 origin refs/heads/availability-data
            git worktree add --detach "$DATA_DIR" FETCH_HEAD
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            mkdir -p "$DATA_DIR"
            cp web/data/snapshot.json "$DATA_DIR/snapshot.json"
            cp web/data/status.json "$DATA_DIR/status.json"
          fi
      - name: Build static website
        run: python scripts/build_site.py --data "$RUNNER_TEMP/sagasu-public-data" --output dist
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
