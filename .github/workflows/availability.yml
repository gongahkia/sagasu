name: Daily availability and website

on:
  schedule:
    # 06:17 Singapore (UTC+8), deliberately away from the top of the hour.
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'asset/logo/**'
      - '.github/workflows/availability.yml'

permissions:
  contents: read

concurrency:
  group: sagasu-public-availability
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      scrape_outcome: ${{ steps.scrape.outcome }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scraper dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chrome
      - name: Load retained public snapshot
        env:
          DATA_DIR: ${{ runner.temp }}/sagasu-public-data
        run: |
          if git ls-remote --exit-code --heads origin availability-data > /dev/null; then
            git fetch --depth=1 origin refs/heads/availability-data
            git worktree add --detach "$DATA_DIR" FETCH_HEAD
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            git worktree add --detach "$DATA_DIR" HEAD
            git -C "$DATA_DIR" checkout --orphan availability-data
            git -C "$DATA_DIR" rm -rf .
            cp web/data/snapshot.json "$DATA_DIR/snapshot.json"
            cp web/data/status.json "$DATA_DIR/status.json"
          fi
      - name: Read-only seven-day scrape
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SMU_LOGIN_EMAIL: ${{ secrets.SMU_LOGIN_EMAIL }}
          SMU_LOGIN_PASSWORD: ${{ secrets.SMU_LOGIN_PASSWORD }}
          SAGASU_BROWSER_CHANNEL: chrome
        run: python -m bot.scrape_daily --output "$RUNNER_TEMP/sagasu-attempt"
      - name: Retain sanitized attempt and last complete snapshot
        if: github.event_name != 'push'
        run: |
          python scripts/publish_snapshot.py --attempt "$RUNNER_TEMP/sagasu-attempt" --retained "$RUNNER_TEMP/sagasu-public-data"
          git -C "$RUNNER_TEMP/sagasu-public-data" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/sagasu-public-data" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/sagasu-public-data" add -- snapshot.json status.json
          if ! git -C "$RUNNER_TEMP/sagasu-public-data" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/sagasu-public-data" commit -m 'Refresh public availability snapshot'
            snapshot_commit=$(git -C "$RUNNER_TEMP/sagasu-public-data" rev-parse HEAD)
            git push origin "$snapshot_commit:refs/heads/availability-data"
          fi
      - name: Build static website
        run: python scripts/build_site.py --data "$RUNNER_TEMP/sagasu-public-data" --output dist
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [build, deploy]
    if: always() && needs.build.outputs.scrape_outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report failed refresh after publishing status
        run: |
          echo 'Daily availability refresh failed. The website retains the last complete snapshot. Check SMU authentication and FBS layout locally; credentials and raw browser logs are intentionally not published.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
