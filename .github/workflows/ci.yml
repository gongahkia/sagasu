name: Validate Telegram bot

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python bot
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed packages
        run: python -m pip check

      - name: Compile Python modules
        run: python -m compileall -q bot

      - name: Import bot modules
        run: |
          python - <<'PY'
          import bot.fbs_client
          import bot.fbs_calendar
          import bot.bot

          print("bot modules imported successfully")
          PY

      - name: Check CLI entrypoints
        run: |
          sagasu --help
          sagasu --version
          python -m bot --help
          python -m bot.bot --help

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
