name: Sagasu CI/CD on Push

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed packages
        run: python -m pip check

      - name: Install Chromium for local DOM fixture tests
        run: python -m playwright install --with-deps chromium

      - name: Compile Python modules
        run: python -m compileall -q sagasu

      - name: Import agent modules
        run: |
          python - <<'PY'
          import sagasu.fbs_client
          import sagasu.fbs_calendar
          import sagasu.mcp_server

          print("agent modules imported successfully")
          PY

      - name: Check CLI entrypoints
        run: |
          sagasu --help
          sagasu --version
          python -m sagasu --help
          sagasu mcp --help

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
